[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-safety-chatbot"
version = "0.1.0"
description = "RAG chatbot for plain-English compliance questions over FRA (49 CFR) and ERA (EU) rail safety regulations"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.117.0",
    "rank_bm25>=0.2.2",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
railsafe-chat = "railsafe.chat:main"
railsafe-ingest = "railsafe.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
